        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token]
              properties:
                temp_token: { type: string }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions

  /auth/mfa/webauthn/login-verify:
    post:
