  # Advanced Project Management Endpoints (PR 1)
  /projects/{projectId}/dependencies:
    get:
      summary: タスク依存関係一覧取得
      responses:
        '200':
          description: 依存関係一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDependency'
    post:
      summary: タスク依存関係登録（循環依存および自己依存の自動検知防止）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [predecessor_id, successor_id]
              properties:
                predecessor_id:
                  type: string
                  format: uuid
                successor_id:
                  type: string
                  format: uuid
                dependency_type:
                  type: string
                  enum: [FS, SS, FF, SF]
                  default: FS
                lag_days:
                  type: integer
                  default: 0
      responses:
        '201':
          description: 依存関係登録完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDependency'
        '400':
          description: 循環依存または不正なリクエスト

