      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: 作成完了

  /projects/{projectId}/tasks/{taskId}/owner:
    put:
      summary: タスクのオーナー権限委譲（現オーナーまたはプロジェクトAdminのみ可能）
