openapi: 3.0.3
info:
  title: Polaris Project Management API
  version: 1.0.0
  description: |
    Polaris プロジェクト管理WebアプリケーションのバックエンドREST API仕様書。
    - 主キーはすべて **UUID v7**
    - プロジェクト ＞ 課題（Issue） ＞ タスク（Task）の階層構造
    - 3層の権限管理（システム権限 / プロジェクトロール / テンプレート項目別の閲覧・編集制限＋オーナー許可）
    - 1〜3カラム可変レイアウトテンプレート・カスタム項目（9種）
    - ガントチャート（予定・実績2段バー操作）・マトリクス型カンバン（縦横・セル内移動）
    - 最大100件・1ファイル最大1GBの添付ファイル一元管理（SHA-256重複排除＋DBチャンク格納）
    - ダイレクトMX送信 / 外部SMTPリレーによるメール配信・ドメイン末尾一致制限（最大10件）
    - アプリ内通知およびFCMプッシュ通知
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: polaris_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        warning_code:
          type: string
        is_member:
          type: boolean

    SubjectRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, group]
        id:
          type: string
          format: uuid

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        has_password:
          type: boolean
        google_sub:
          type: string
          nullable: true
        display_name:
          type: string
        avatar_url:
          type: string
        status:
          type: string
          enum: [invited, active, disabled]
        permissions:
          type: array
          items:
            type: string
            enum: [create_project, delete_project, manage_system]
        mfa_enabled:
          type: boolean
        mfa_enforced:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SystemSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        default_hours_per_day:
          type: number
          minimum: 1
          maximum: 24
          multipleOf: 0.01
          description: 1日あたりの基準時間（1.00〜24.00、小数点第2位まで）
        default_issue_template_id:
          type: string
          format: uuid
          nullable: true
        default_task_template_id:
          type: string
          format: uuid
          nullable: true
        allowed_domains:
          type: array
          maxItems: 10
          items:
            type: string
        require_mfa:
          type: boolean
          description: システム全体での2要素認証（MFA）強制有効フラグ
        updated_at:
          type: string
          format: date-time

    SMTPSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        use_auth:
          type: boolean
        username:
          type: string
        has_password:
          type: boolean
        from_email:
          type: string
        from_name:
          type: string
        updated_at:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        hours_per_day:
          type: number
          minimum: 1
          maximum: 24
          multipleOf: 0.01
          description: 1日あたりの基準時間（1.00〜24.00、小数点第2位まで）
        default_issue_template_id:
          type: string
          format: uuid
          nullable: true
        default_task_template_id:
          type: string
          format: uuid
          nullable: true
        total_planned_cost:
          type: number
          multipleOf: 0.01
          description: プロジェクト配下全タスクの予定コスト集計値（小数点第2位まで）
        total_actual_cost:
          type: number
          multipleOf: 0.01
          description: プロジェクト配下全タスクの実績コスト集計値（小数点第2位まで）
        created_by:
          type: string
          format: uuid
          nullable: true
        current_user_role:
          type: string
          enum: ["", viewer, editor, admin]
        is_member:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Status:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        display_order:
          type: integer
          minimum: 1
          maximum: 10
        name:
          type: string
        color:
          type: string
        created_at:
          type: string
          format: date-time

    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        color:
          type: string
        created_at:
          type: string
          format: date-time

    CustomFieldDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
          enum: [issue, task]
        name:
          type: string
        field_type:
          type: string
          enum: [text_single, text_multi, markdown, number, date, radio, checkbox, select, user_group]
        options:
          type: array
          items: {}
        created_at:
          type: string
          format: date-time

    TemplateField:
      type: object
      properties:
        id:
          type: string
          format: uuid
        column_order:
          type: integer
          minimum: 1
          maximum: 3
        field_source:
          type: string
          enum: [standard, custom]
        field_key:
          type: string
        is_hidden:
          type: boolean
          description: 画面上でその項目自体を非表示にするフラグ（titleは常時false）
        is_restricted:
          type: boolean
        allow_owner_view:
          type: boolean
        allow_owner_edit:
          type: boolean
        view_subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        edit_subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'

    TemplateRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_order:
          type: integer
        columns_count:
          type: integer
          minimum: 1
          maximum: 3
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
          enum: [issue, task]
        name:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TemplateRow'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FieldPermissionState:
      type: object
      properties:
        is_hidden:
          type: boolean
        can_view:
          type: boolean
        can_edit:
          type: boolean
        placeholder:
          type: string

    IssueRollup:
      type: object
      properties:
        planned_start_date:
          type: string
          format: date
          nullable: true
        planned_end_date:
          type: string
          format: date
          nullable: true
        actual_start_date:
          type: string
          format: date
          nullable: true
        actual_end_date:
          type: string
          format: date
          nullable: true
        total_planned_hours:
          type: number
          multipleOf: 0.01
        total_actual_hours:
          type: number
          multipleOf: 0.01
        total_planned_cost:
          type: number
          multipleOf: 0.01
          description: 配下タスクの予定コスト合計（小数点第2位まで）
        total_actual_cost:
          type: number
          multipleOf: 0.01
          description: 配下タスクの実績コスト合計（小数点第2位まで）
        weighted_progress:
          type: number
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        task_count:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        issue_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
          nullable: true
        owner_user_id:
          type: string
          format: uuid
        status_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
        planned_start_date:
          type: string
          format: date
          nullable: true
        planned_end_date:
          type: string
          format: date
          nullable: true
        actual_start_date:
          type: string
          format: date
          nullable: true
        actual_end_date:
          type: string
          format: date
          nullable: true
        planned_hours:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: 予定工数（h、小数点第2位まで）
          nullable: true
        actual_hours:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: 実績工数（h、小数点第2位まで）
          nullable: true
        planned_cost:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: 予定コスト（小数点第2位まで、0以上）
          nullable: true
        actual_cost:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: 実績コスト（小数点第2位まで、0以上）
          nullable: true
        sprint_id:
          type: string
          format: uuid
          nullable: true
          description: 所属スプリントID
        story_points:
          type: number
          minimum: 0
          multipleOf: 0.1
          description: ストーリーポイント（SP）
          nullable: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        label_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_values:
          type: object
          additionalProperties: true
        field_permissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldPermissionState'
        kanban_order:
          type: integer
        gantt_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Issue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
          nullable: true
        owner_user_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [open, closed]
        title:
          type: string
        description:
          type: string
          nullable: true
        label_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_values:
          type: object
          additionalProperties: true
        field_permissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldPermissionState'
        display_order:
          type: integer
        rollup:
          $ref: '#/components/schemas/IssueRollup'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [issue, task]
        target_id:
          type: string
          format: uuid
        blob_id:
          type: string
          format: uuid
        sha512_hash:
          type: string
        file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        mime_type:
          type: string
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [issue, task]
        target_id:
          type: string
          format: uuid
        author_user_id:
          type: string
          format: uuid
        body:
          type: string
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        notification_type:
          type: string
          enum: [mention, assign]
        target_type:
          type: string
          enum: [issue, task]
        target_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    PersonalAccessToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
          example: "plr_pat_123456"
        scopes:
          type: array
          items:
            type: string
            enum:
              - read:projects
              - write:projects
              - read:tasks
              - write:tasks
              - read:issues
              - write:issues
              - read:comments
              - write:comments
              - admin:system
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.updated
              - task.status_changed
              - issue.created
              - issue.state_changed
              - comment.created
              - attachment.created
        is_active:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event:
          type: string
        status_code:
          type: integer
          nullable: true
        duration_ms:
          type: integer
        request_body:
          type: object
        response_body:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TaskDependency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        predecessor_id:
          type: string
          format: uuid
        successor_id:
          type: string
          format: uuid
        dependency_type:
          type: string
          enum: [FS, SS, FF, SF]
          default: FS
        lag_days:
          type: integer
          default: 0
        created_at:
          type: string
          format: date-time

    Sprint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [planned, active, closed]
        task_count:
          type: integer
        total_story_points:
          type: number
        total_planned_hours:
          type: number
        total_actual_hours:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BurndownDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        ideal_story_points:
          type: number
        remaining_story_points:
          type: number
        ideal_hours:
          type: number
        remaining_hours:
          type: number

    SprintBurndown:
      type: object
      properties:
        sprint_id:
          type: string
          format: uuid
        sprint_name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        total_story_points:
          type: number
        total_hours:
          type: number
        points:
          type: array
          items:
            $ref: '#/components/schemas/BurndownDataPoint'

    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        action:
          type: string
        details:
          type: object
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    WikiPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/WikiPage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InboundWebhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: 作成時のみ平文トークンが返却されます
        secret:
          type: string
        default_issue_id:
          type: string
          format: uuid
          nullable: true
        default_status_id:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InboundWebhookPayload:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        status_id:
          type: string
        issue_id:
          type: string
        planned_hours:
          type: number
        story_points:
          type: number
        assignee_ids:
          type: array
          items:
            type: string
            format: uuid
        label_ids:
          type: array
          items:
            type: string
            format: uuid

    CSVImportResult:
      type: object
      properties:
        imported_tasks:
          type: integer
        errors:
          type: array
          items:
            type: string

    UserInviteItem:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string

    BulkInviteRequest:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/UserInviteItem'
        default_group_ids:
          type: array
          items:
            type: string
            format: uuid
        default_permissions:
          type: array
          items:
            type: string

    BulkInviteFailure:
      type: object
      properties:
        email:
          type: string
        reason:
          type: string

    BulkInviteResult:
      type: object
      properties:
        total:
          type: integer
        invited_count:
          type: integer
        failed_count:
          type: integer
        invited_users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BulkInviteFailure'

    WebAuthnCredential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credential_id:
          type: string
        attestation_type:
          type: string
        aaguid:
          type: string
          nullable: true
        sign_count:
          type: integer
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    MFAStatus:
      type: object
      properties:
        mfa_enabled:
          type: boolean
        mfa_enforced:
          type: boolean
        system_mfa_required:
          type: boolean
        has_totp:
          type: boolean
        has_webauthn:
          type: boolean
        webauthn_credentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredential'
        remaining_backup_codes:
          type: integer

paths:
  /health:
    get:
      summary: ヘルスチェック
      security: []
      responses:
        '200':
          description: OK

  /setup/status:
    get:
      summary: 初期セットアップ要否確認（ユーザー0件判定）
      security: []
      responses:
        '200':
          description: セットアップ状態

  /setup/init:
    post:
      summary: 初期システム管理者アカウント作成（ユーザー0件時のみ有効）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                password: { type: string }
                display_name: { type: string }
                google_sub: { type: string }
      responses:
        '201':
