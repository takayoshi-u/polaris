          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: targetType
          required: true
          schema: { type: string, enum: [issues, tasks] }
        - in: path
          name: targetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
